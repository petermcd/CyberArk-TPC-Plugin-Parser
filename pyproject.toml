[project]
name = "cyberark-tpc-plugin-parser"
version = "0.4.2"
description = "A package to help parse CyberArk TPC plugin prompts and process files."
keywords = ["cyberark", "parser", "tpc"]
authors = [{ name = "Peter McDonald", email = "git@petermcdonald.co.uk"}]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = []

[project.urls]
homepage = "https://github.com/petermcd/CyberArk-TPC-Plugin-Parser"
repository = "https://github.com/petermcd/CyberArk-TPC-Plugin-Parser.git"
issues = "https://github.com/petermcd/CyberArk-TPC-Plugin-Parser/issues"

[dependency-groups]
dev = [
    "pygments>=2.21.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--cov=tpc_plugin_parser --cov-report term-missing --cov-report xml:coverage.xml"

[tool.ruff]
line-length = 120

[cosmic-ray]
module-path = "tpc_plugin_parser"
timeout = 10.0
excluded-modules = []
test-command = "uv run pytest"

[cosmic-ray.distributor]
name = "local"
