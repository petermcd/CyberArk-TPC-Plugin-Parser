name: "CodeQL"

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '21 1 * * 2'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - 'python'

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@16df4fbc19aea13d921737861d6c622bf3cefe23
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@16df4fbc19aea13d921737861d6c622bf3cefe23

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@16df4fbc19aea13d921737861d6c622bf3cefe23
